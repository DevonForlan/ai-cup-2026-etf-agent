# LLM layer configuration (Round 04). Changing this file = new code_version.
# provider: mock | replay | template | google | openai | anthropic
#   mock     = deterministic rule-based stand-in (NOT an LLM; for pipeline/safety tests only)
#   replay   = answer only from logs/llm/**/calls.jsonl (no API calls)
#   template = no LLM at all (deterministic templates)
# Real providers need the key in an environment variable or .env (see .env.example).
provider: template
model: null                 # e.g. set explicitly when enabling a real provider; verify the model id first
endpoint: null              # optional override of the provider endpoint
temperature: 0.0
seed: 7
max_tokens: 1200
timeout_sec: 30             # per call
total_budget_sec: 120       # whole LLM layer per run; exceeded -> remaining steps use templates
retries: 2                  # retryable errors only (timeout / 429 / 5xx / format)
max_calls_per_day: 60
max_tokens_per_day: 200000
max_cost_per_day_usd: 2.0
price_usd_per_1m_tokens:    # unknown until a provider/model is chosen -> cost reported as null
  input: null
  output: null
log_calls: true
blind_mode: false           # true: tickers -> SEC###, dates -> Day T in prompts (backtests on pre-cutoff data)

narrative:
  mode: template            # template | llm  (llm text is used only if it passes the grounding reviewer)
  reviewer: deterministic   # deterministic | llm+deterministic
  max_thesis_items: 35
  thesis_llm: true          # false -> per-decision thesis stays template (runtime budget RESTRICTED phase)

research:                   # Round 07 MOPS research narrative (inference over cited announcements; never a source)
  enabled: false
  lookback_days: 5
  max_documents: 8          # one batched call; max 2 documents per ticker
  max_inferences: 4

events:
  enabled: false            # run the event extractor (adds EventFacts to the evidence graph)
  max_documents_per_day: 200
  lookback_days: 5
  cache: true               # per-document extraction cache (data/cache/events); disable for benchmarks

llm_signal:                 # bounded event adjustment of the quant score (Phase 5B)
  enabled: false
  max_percentile_adjustment: 5     # percentile points at event_score = +/-1
  min_confidence: 0.70
  decay: linear                    # linear | exponential
  default_horizon_days: 5
