# TACTICAL_TECH_OVERWEIGHT_V1 - Owner-mandated technology exposure floor over the immutable Frozen Quant v1.
# SEPARATE from config/strategy_quant_v1.yaml (never edited). Applied only by agent/tactical/tech_overweight.py.
#   Issue #63 (2026-11-10): one-day floor 75% for the 2026-11-11 D-Plan (already submitted 2026-11-10 20:31; kept as history).
#   Issue #65 (2026-11-10): PERSISTENT floor 85% from the 2026-11-12 D-Plan on, until the Owner explicitly changes / cancels it
#   (no `to` date: it must NOT auto-expire). To change or stop it: edit the segment's `min`, add `to`, or set enabled: false.
# The 2026-11-11 FINAL was already submitted under the 75% rule; that history is not rewritten, so 2026-11-11 keeps its own segment.
version: TACTICAL_TECH_OVERWEIGHT_V1
enabled: true
owner_directive: 'GitHub Issue #65 (OWNER OVERRIDE 2026-11-10: persistent tech floor >=85%, supersedes the Issue #63 one-day 75% rule for later D-Plans); Issue #63 for 2026-11-11'
frozen_quant_sha256: f34fa02e924011b20c52a4bd42e961169f97e1950e76e04b7e78dc43ac23d2e0
owner_tech_floor: 0.85
floor_schedule:
- {from: '2026-11-11', to: '2026-11-11', min: 0.75}     # Issue #63 (history; the submitted FINAL is 75.95%)
- {from: '2026-11-12', min: 0.85}                       # Issue #65 persistent; no end date
# No artificial ceiling above the minimum: only the per-name cap (Quant other_target_cap), holdings 20-30, cash, Active Share, 30 orders apply.
# Technology classification = the list used since #41-#43 (config/tactical_override_v2.yaml: reduce_tickers).
tech_classification_file: config/tactical_override_v2.yaml
tech_classification_key: reduce_tickers
funding_rule: lowest-ranked non-technology Frozen Quant targets first; only when all of them are used up, cash down to min_cash_weight (cash stays far below the 25% cap)
min_cash_weight: 0.08
selection_rule: technology names must come from Frozen Quant v1's own targets / eligible ranking (no hand-picked ticker)
