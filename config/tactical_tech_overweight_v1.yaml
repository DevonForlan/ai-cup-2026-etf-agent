# TACTICAL_TECH_OVERWEIGHT_V1 - Owner-mandated technology exposure floor over the immutable Frozen Quant v1.
# SEPARATE from config/strategy_quant_v1.yaml (never edited). Applied only by agent/tactical/tech_overweight.py.
#   Issue #63 (2026-11-10): one-day floor 75% for the 2026-11-11 D-Plan (already submitted 2026-11-10 20:31; kept as history).
#   Issue #65 (2026-11-10): PERSISTENT floor 85% from the 2026-11-12 D-Plan on, until the Owner explicitly changes / cancels it
#   (no `to` date: it must NOT auto-expire). To change or stop it: edit the segment's `min`, add `to`, or set enabled: false.
# The 2026-11-11 FINAL was already submitted under the 75% rule; that history is not rewritten, so 2026-11-11 keeps its own segment.
version: TACTICAL_TECH_OVERWEIGHT_V1
enabled: true
owner_directive: 'GitHub Issue #68 (OWNER 2026-11-13: best risk-adjusted portfolio subject to tech >= 85%, from the 2026-11-16 D-Plan; supersedes the highest-compliant search); GitHub Issue #65 (OWNER OVERRIDE 2026-11-10: persistent tech floor >=85%, supersedes the Issue #63 one-day 75% rule for later D-Plans); Issue #63 for 2026-11-11'
frozen_quant_sha256: f34fa02e924011b20c52a4bd42e961169f97e1950e76e04b7e78dc43ac23d2e0
owner_tech_floor: 0.85
floor_schedule:
- {from: '2026-11-11', to: '2026-11-11', min: 0.75}     # Issue #63 (history; the submitted FINAL is 75.95%)
- {from: '2026-11-12', to: '2026-11-15', min: 0.85}      # Issue #65 highest-compliant search (history: 11/12, 11/13 FINALs)
- {from: '2026-11-16', to: '2026-11-18', min: 0.85, policy: risk_adjusted}  # Issue #68 risk-adjusted policy (history: 11/16-11/18 FINALs)
- {from: '2026-11-19', to: '2026-11-20', min: 0.93, policy: aggressive}  # Owner 2026-11-18: AGGRESSIVE_RETURN (history: 11/19, 11/20 FINALs)
- {from: '2026-11-23', to: '2026-11-23', min: 0.0, policy: defensive}  # Owner 2026-11-20 option B: DEFENSIVE_DIFFERENTIATION (history: 11/23 FINAL)
- {from: '2026-11-24', to: '2026-11-24', min: 0.93, policy: aggressive}  # Owner 2026-11-23 17:2x: back to AGGRESSIVE_RETURN (history: 11/24 FINAL)
- {from: '2026-11-25', min: 0.93, policy: sprint}         # Owner 2026-11-24: final sprint, technology as close to 100% as feasible (block `sprint:`)
# No artificial ceiling above the minimum: only the per-name cap (Quant other_target_cap), holdings 20-30, cash, Active Share, 30 orders apply.
# Technology classification = the list used since #41-#43 (config/tactical_override_v2.yaml: reduce_tickers).
tech_classification_file: config/tactical_override_v2.yaml
tech_classification_key: reduce_tickers
funding_rule: lowest-ranked non-technology Frozen Quant targets first; only when all of them are used up, cash down to min_cash_weight (cash stays far below the 25% cap)
min_cash_weight: 0.08
selection_rule: technology names must come from Frozen Quant v1's own targets / eligible ranking (no hand-picked ticker)

# Issue #68 - risk-adjusted policy parameters (policy: risk_adjusted segments only). Documented ASSUMPTIONS, not fitted to results.
risk_adjusted:
  bands: {STRONG: [0.90, 0.95], NORMAL: [0.87, 0.92], DEFENSIVE: [0.85, 0.88]}
  strong_ceiling: 0.95
  floor_buffer: 0.005               # candidates must realise >= floor + 0.5pt (price drift before the next-day fills)
  stay_band_tolerance: 0.03         # existing holdings stay eligible up to band max + 3pt (stability: do not trade only to move between nearby exposures)
  regime_thresholds: {vol_high: 0.020, breadth_low: 0.45, breadth_strong: 0.65, sox_down: -0.02, txf_down: -0.015}
  score_weights: {quant_rank: 0.40, rs5: 0.15, rs20: 0.15, flow5: 0.10, vol20: 0.10, gap: 0.10}
  sharp_move_threshold: 0.07        # |gap| or |daily move| >= 7% in 5d (limit is 10%) -> extra score penalty
  tilt_kappa: 0.35                  # allocation multiplier exp(kappa*z) clipped to [0.5, 2]
  utility: {ic: 0.03, horizon_days: 5, gamma: 4.0, rho_in: 0.75, rho_x: 0.55, rho_t: 0.30, rho_n: 0.25}
  cost_model: {fee: 0.001425, sell_tax: 0.003, slippage: 0.0010, per_order: 0.00002}
  min_improvement: 0.0005           # keep the existing portfolio unless another candidate beats its utility by > 5 bp of NAV (about one round trip on 4-5% NAV of turnover)
  bucket_cap: 0.30                  # max NAV share of one named technology sub-sector (memory, PCB/CCL/materials, ASIC/IC design)
  # Sub-sector CLASSIFICATION (risk-factor grouping only; never a selection list). Unlisted technology names = other_tech (foundry/OSAT/ODM/servers/etc).
  buckets:
    memory_storage: ['2337', '2344', '2408', '2451', '3260', '5289', '6770', '8299']
    pcb_ccl_materials: ['1815', '2313', '2368', '2383', '3037', '3044', '3189', '4749', '4958', '6274', '8046', '8358']
    asic_ic_design: ['2379', '2454', '3034', '3227', '3443', '3529', '3661', '4966', '5274', '6415']

# Owner decision 2026-11-18 (rules PDF: preliminary ranking = final NAV after the 11/27 close; MDD only breaks ties; team far behind with
# 7 trading days left). Overrides of the risk_adjusted block when the floor_schedule segment says `policy: aggressive`. Every hard guard
# is unchanged (Quant _finalize: lots, per-name cap other_target_cap 9%, holdings 20-30, cash < 25% and >= 0 under stress, Active Share,
# <= 30 orders, validator, compliance). Rollback: set the 2026-11-19 segment back to `policy: risk_adjusted, min: 0.85`.
aggressive:
  bands: {STRONG: [0.93, 0.97], NORMAL: [0.93, 0.97], DEFENSIVE: [0.93, 0.97]}   # regime is still computed and recorded, not used to de-risk
  strong_ceiling: 0.97
  min_cash_weight: 0.03             # cash floor (was 8%): stays well above 0 under the stress fills, far below the 25% cap
  bucket_cap: 0.45                  # sub-sector concentration allowed up to 45% NAV (was 30%)
  score_weights: {quant_rank: 0.35, rs5: 0.0, rs20: 0.25, flow5: 0.15, vol20: 0.0, gap: 0.0, rebound: 0.25}  # momentum + flow + 5d reversal; no volatility penalty
  sharp_move_penalty: 0.0           # limit-down names are rebound candidates, not penalised
  tilt_kappa: 0.8
  tilt_clip: [0.3, 3.0]
  utility: {gamma: 0.0}             # select by expected return net of transaction cost (risk aversion off)
  min_improvement: 0.0              # no preference for the existing portfolio

# Owner decision 2026-11-20 (option B, GitHub #68): the technology portfolio moves with the active-ETF crowd (beta ~0.97) and cannot change
# the ranking; differ from the crowd with low-volatility NON-technology names + cash. agent/tactical/defensive_diff.py. Hard guards unchanged
# (Quant _finalize). Fallback if nothing passes: the aggressive overlay (fallback_tech_min). Rollback: the 2026-11-23 segment -> policy: aggressive, min: 0.93.
fallback_tech_min: 0.93
defensive:
  cash_target: 0.16                 # official cap 25%; +/-5% stress fills and a further market drop keep it below ~21%
  cash_band: [0.10, 0.20]           # once no technology is left: keep the portfolio while cash stays inside this band
  max_weight: 0.09                  # per name (Quant other_target_cap 9%, official 10%)
  min_holdings: 21                  # official 20-30 (one name of margin)
  max_holdings: 28
  max_orders: 30                    # official D-Plan limit
  vol_lookback: 60                  # trading days of realised volatility used to rank the non-technology pool
  min_avg_amount: 300000000         # 20-day average traded value (TWD) >= 300M: a ~4.5% NAV position stays ~10% of a day's value

# Owner decision 2026-11-24 (final days): technology "as close to 100% as feasible". agent/tactical/tech_sprint.py: sell every
# non-technology holding, keep the holdings count by ADDING technology names (Quant-eligible first, then the technology list, by the
# AGGRESSIVE_RETURN composite score), highest level that passes Quant _finalize (cash >= 0 under the +/-5% stress fills, holdings
# 20-30, per-name cap, <= 30 orders). Fallback: the aggressive overlay (fallback_tech_min). Rollback: the 2026-11-25 segment -> policy: aggressive.
sprint:
  level_max: 1.00                   # Owner 2026-11-24 ~21:30 "97-98%": first try 100%; lot rounding + the stress guard (cash >= 0 under +/-5% fills) decide what is feasible (11/26 replay: 97.7%)
  level_min: 0.85
  max_weight: 0.09                  # per name (Quant other_target_cap 9%, official 10%)
  min_holdings: 21                  # official 20-30 (one name of margin)
  max_holdings: 28
  max_orders: 30
  no_trade_band: 0.01               # a technology holding within 1pt of the target weight is left untouched (saves orders / cost)
  min_avg_amount: 300000000         # new names: 20-day average traded value >= 300M TWD
