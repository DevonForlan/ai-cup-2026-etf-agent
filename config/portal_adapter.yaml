# Official portal UI adapter (Issue #4) — the ONLY place for selectors and official wording.
# Core workflow code never hard-codes portal DOM or text. After the REAL_E2E only this file is updated.
#
# status values:
#   CONFIRMED_REAL_E2E          observed on the real logged-in page (read-only discovery or real E2E); usable for actions
#   CONFIRMED_PUBLIC_BUNDLE     present in the portal's public frontend code (route labels / error texts)
#   OWNER_OBSERVED_LABEL        visible label the Owner saw on the logged-in page; DOM structure unconfirmed
#   GENERIC_CANDIDATE           standard element (e.g. input[type=file]); identity must be confirmed
#   PENDING_WINDOW_ONLY         only exists while a submission window is open / after an upload or submit -> no
#                               strategy until observed in the real window, never guessed
#   PENDING_REAL_E2E_SELECTOR   visible after login but not captured yet -> no strategy, never guessed
#   PENDING_REAL_E2E_WORDING    official wording not seen yet -> never matched
# Strategy order (portal_driver tries in this order): role -> label -> accessible name -> stable visible text ->
# stable data-* / id -> CSS fallback. The first strategy is the primary, the rest are fallbacks. No absolute XPath, no
# nth-child-only selectors, no pixel / screen coordinates, no layout dependency.
# Every entry records `source` (evidence) and `confidence` (HIGH / MEDIUM / LOW / NONE).
# Action policy: upload / submit need CONFIRMED_REAL_E2E in COMPETITION; in --official-test (sealed test) they may use
# OWNER_OBSERVED_LABEL / GENERIC_CANDIDATE. PENDING_* entries can never be used for anything -> fail closed.

