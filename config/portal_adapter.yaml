# Official portal UI adapter (Issue #4) — the ONLY place for selectors and official wording.
# Core workflow code never hard-codes portal DOM or text. After the REAL_E2E only this file is updated.
#
# status values:
#   CONFIRMED_REAL_E2E          observed on the real logged-in page (read-only discovery or real E2E); usable for actions
#   CONFIRMED_PUBLIC_BUNDLE     present in the portal's public frontend code (route labels / error texts)
#   OWNER_OBSERVED_LABEL        visible label the Owner saw on the logged-in page; DOM structure unconfirmed
#   GENERIC_CANDIDATE           standard element (e.g. input[type=file]); identity must be confirmed
#   PENDING_WINDOW_ONLY         only exists while a submission window is open / after an upload or submit -> no
#                               strategy until observed in the real window, never guessed
#   PENDING_REAL_E2E_SELECTOR   visible after login but not captured yet -> no strategy, never guessed
#   PENDING_REAL_E2E_WORDING    official wording not seen yet -> never matched
# Strategy order (portal_driver tries in this order): role -> label -> accessible name -> stable visible text ->
# stable data-* / id -> CSS fallback. The first strategy is the primary, the rest are fallbacks. No absolute XPath, no
# nth-child-only selectors, no pixel / screen coordinates, no layout dependency.
# Every entry records `source` (evidence) and `confidence` (HIGH / MEDIUM / LOW / NONE).
# Action policy: upload / submit need CONFIRMED_REAL_E2E in COMPETITION; in --official-test (sealed test) they may use
# OWNER_OBSERVED_LABEL / GENERIC_CANDIDATE. PENDING_* entries can never be used for anything -> fail closed.

version: 2
portal_url: "https://fundaiagent.esun-ai-challenge.tw/docs"
login_path_fragment: "/login"            # CONFIRMED_PUBLIC_BUNDLE: router path of 參賽者登入
login_url_markers: ["/login", "/sso"]    # CONFIRMED_REAL_E2E (2026-10-23 read-only discovery): unauthenticated
                                         # /docs -> esun-ai-challenge.tw/sso -> /login (Email / 密碼 form, never filled)

selectors:
  nav_docs_link:
    status: CONFIRMED_PUBLIC_BUNDLE
    strategies: [{by: role, role: link, name: "文件繳交"}, {by: text, text: "文件繳交"}]
    source: "public frontend bundle route label (2026-10-22)"
    confidence: HIGH
  login_required_marker:
    status: CONFIRMED_PUBLIC_BUNDLE
    strategies: [{by: text, text: "參賽者登入"}]
    source: "public frontend bundle (2026-10-22)"
    confidence: HIGH
  no_window_marker:
    status: CONFIRMED_PUBLIC_BUNDLE
    strategies: [{by: text, text: "目前不在繳交時間內"}]
    source: "public frontend bundle error text (2026-10-22)"
    confidence: HIGH
  dplan_file_input:
    status: GENERIC_CANDIDATE
    strategies: [{by: css, css: "input[type=\"file\"][accept*=\"json\"]"}]
    source: "standard file input; the page may also have a PDF input (strategy document)"
    confidence: MEDIUM
  validation_result_panel:
    status: OWNER_OBSERVED_LABEL
    strategies: [{by: text, text: "檢核結果"}]
    source: "Owner observation of the logged-in 文件繳交 page (Issue #4)"
    confidence: MEDIUM
  submit_button:
    status: OWNER_OBSERVED_LABEL
    strategies: [{by: role, role: button, name: "送出繳交"}, {by: text, text: "送出繳交"}]
    source: "Owner observation of the logged-in 文件繳交 page (Issue #4)"
    confidence: MEDIUM
  submission_history_table:
    status: OWNER_OBSERVED_LABEL
    strategies: [{by: text, text: "歷史繳交紀錄"}]
    source: "Owner observation of the logged-in 文件繳交 page (Issue #4)"
    confidence: MEDIUM
  datapack_download:
    status: OWNER_OBSERVED_LABEL
    strategies: [{by: role, role: button, name: "下載資料包"}, {by: text, text: "下載資料包"}]
    source: "Owner observation of the logged-in 文件繳交 page (Issue #4)"
    confidence: MEDIUM
  upload_area:               {status: PENDING_REAL_E2E_SELECTOR, strategies: [], source: "not captured yet", confidence: NONE}
  upload_button:             {status: PENDING_REAL_E2E_SELECTOR, strategies: [], source: "not captured yet", confidence: NONE}
  history_rows:              {status: PENDING_REAL_E2E_SELECTOR, strategies: [], source: "not captured yet", confidence: NONE}
  trade_date:                {status: PENDING_REAL_E2E_SELECTOR, strategies: [], source: "not captured yet", confidence: NONE}
  team_id:                   {status: PENDING_REAL_E2E_SELECTOR, strategies: [], source: "not captured yet", confidence: NONE}
  attempt_count:             {status: PENDING_REAL_E2E_SELECTOR, strategies: [], source: "not captured yet", confidence: NONE}
  strategy_document_status:  {status: PENDING_REAL_E2E_SELECTOR, strategies: [], source: "not captured yet", confidence: NONE}
  server_validation_pass_marker: {status: PENDING_WINDOW_ONLY, strategies: [], source: "appears only after an upload in an open window", confidence: NONE}
  server_validation_fail_marker: {status: PENDING_WINDOW_ONLY, strategies: [], source: "appears only after an upload in an open window", confidence: NONE}
  submit_confirmation_modal: {status: PENDING_WINDOW_ONLY, strategies: [], source: "appears only after pressing 送出繳交", confidence: NONE}
  submit_confirm_button:     {status: PENDING_WINDOW_ONLY, strategies: [], source: "appears only after pressing 送出繳交", confidence: NONE}
  accepted_history_marker:   {status: PENDING_WINDOW_ONLY, strategies: [], source: "needs an accepted submission", confidence: NONE}
  rejected_marker:           {status: PENDING_WINDOW_ONLY, strategies: [], source: "needs a rejected submission", confidence: NONE}

wording:
  # official texts; markers are matched verbatim (substring), never fuzzily
  window_closed:     {status: CONFIRMED_PUBLIC_BUNDLE, markers: ["目前不在繳交時間內，本次未送出。"], source: "public bundle", confidence: HIGH}
  rehearsal_closed:  {status: CONFIRMED_PUBLIC_BUNDLE, markers: ["目前不在開賽前試繳期間內，檢核未執行。"], source: "public bundle", confidence: HIGH}
  attempt_limit:     {status: CONFIRMED_PUBLIC_BUNDLE, markers: ["今日繳交次數已用盡，已收件的版本不受影響。"], source: "public bundle", confidence: HIGH}
  auth_loop:         {status: CONFIRMED_PUBLIC_BUNDLE, markers: ["登入後仍無法通過驗證，請聯繫主辦單位。"], source: "public bundle", confidence: HIGH}
  file_too_large:    {status: CONFIRMED_PUBLIC_BUNDLE, markers: ["檔案超過大小上限，請縮小後重新上傳。"], source: "public bundle", confidence: HIGH}
  validation_pass:   {status: PENDING_WINDOW_ONLY, markers: [], source: "shown only after an upload", confidence: NONE}
  validation_fail:   {status: PENDING_WINDOW_ONLY, markers: [], source: "shown only after an upload", confidence: NONE}
  submit_success:    {status: PENDING_WINDOW_ONLY, markers: [], source: "shown only after a submit", confidence: NONE}
  history_accepted:  {status: PENDING_WINDOW_ONLY, markers: [], source: "needs an accepted history row", confidence: NONE}
  history_rejected:  {status: PENDING_WINDOW_ONLY, markers: [], source: "needs a rejected history row", confidence: NONE}
  known_modals:      {status: PENDING_REAL_E2E_WORDING, markers: [], source: "none observed yet", confidence: NONE}   # any other modal -> UNEXPECTED_MODAL
