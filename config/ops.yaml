# Operational configuration (Round 05). NOT strategy: changing it never changes investment decisions.
# Official times come from config/competition.yaml (submission_window); nothing is hard-coded here.

data_sources:            # criticality: CRITICAL blocks the run, IMPORTANT degrades, OPTIONAL only warns
  twse_prices:        {criticality: CRITICAL,  max_stale_trading_days: 0}
  tpex_prices:        {criticality: CRITICAL,  max_stale_trading_days: 0}
  twse_institutional: {criticality: IMPORTANT, max_stale_trading_days: 1}
  tpex_institutional: {criticality: IMPORTANT, max_stale_trading_days: 1}
  etf_holdings:       {criticality: IMPORTANT, max_stale_trading_days: 3}
  corporate_actions:  {criticality: IMPORTANT, max_stale_trading_days: 5}
  mops_revenue_first_seen: {criticality: OPTIONAL, max_stale_trading_days: 5}
  mops_material_info: {criticality: OPTIONAL,  max_stale_trading_days: 2}
  taifex_night:       {criticality: OPTIONAL,  max_stale_trading_days: 1}
  us_market:          {criticality: OPTIONAL,  max_stale_trading_days: 2}

reconciliation:          # internal (our simulator) vs official settlement (organiser)
  cash_rounding_tolerance_twd: 5        # |diff| <= this -> MATCH
  cash_minor_tolerance_twd: 2000        # <= this -> MINOR_DIFFERENCE, above -> BLOCK
  nav_minor_tolerance_rel: 0.00005      # relative NAV diff above -> BLOCK
  accrued_dividend_tolerance_twd: 5
  shares_must_match: true               # any share difference -> BLOCK

preflight:
  branch: master
  min_free_disk_gb: 5
  etf_stale_days_warn: 3                # calendar days since newest real ETF holding date
  etf_stale_days_block: 10
  require_official_settlement_in_competition: true
  block_clock_skew_sec: 600             # competition: BLOCK above this (deadline logic unreliable)
  max_clock_skew_sec: 120               # vs. an HTTP Date header (best effort, WARN only)
  python_min: "3.12"

deadline:                # minutes before submission cutoff (competition.yaml submission_window.closes)
  restrict_refresh_minutes: 30          # skip non-critical data refresh
  no_llm_minutes: 15                    # template narrative only, no LLM retries
  package_only_minutes: 10              # only quant-only run + validation + package
  decision_cutoff: "08:30"              # internal hard stop: no NEW investment decision at/after T 08:30
  warn_0800: "08:00"                    # no READY_FOR_UPLOAD yet -> SUBMISSION_WARNING_0800
  high_warn_0815: "08:15"               # no READY_FOR_UPLOAD yet -> SUBMISSION_HIGH_WARNING_0815
  critical_warn_0845: "08:45"           # not ACCEPTED yet -> SUBMISSION_CRITICAL_WARNING_0845 (official close 08:55)

paths:
  settlement_dir: data/settlement
  submissions_dir: submissions
  archive_dir: archive
  ops_logs_dir: logs/ops
  etf_snapshots_dir: data/raw/active_etf
  first_seen_ledger: data/observations/mops_revenue_first_seen.parquet
  ops_reports_dir: reports/ops_daily
  official_datapack_dir: data/official_datapack   # ONLY organiser DataPacks (docs/OFFICIAL_DATAPACK_INTEGRATION.md)
  submission_evidence_dir: data/submission_evidence   # auto-upload audit / screenshots / manual fallback (local only)

freeze:                  # docs/STRATEGY_FREEZE_RECORD.md; preflight/healthcheck BLOCK on mismatch in competition mode
  strategy_config: config/strategy_quant_v1.yaml
  strategy_sha256: "sha256:f34fa02e924011b20c52a4bd42e961169f97e1950e76e04b7e78dc43ac23d2e0"
  frozen_in_commit: f4dfb66

sla:                     # internal operational health thresholds (seconds), not official SLAs
  quant_sec: 10
  narrative_dplan_sec: 300       # D-Plan build incl. LLM narrative (template ~1 s; Claude CLI ~40-130 s)
  validation_sec: 10
  package_sec: 10
  archive_sec: 10
  data_refresh_sec: 300

settlement_entry:
  nav_tolerance_rel: 0.0005      # official NAV vs sum(shares x close) + cash

etf_fetch:
  max_workers: 3                 # round 06 live test: 4 workers = identical data, 2.9x faster; kept at 3 (<= 5)
  previous_dates: 3              # retry policy: previous published dates before the stored fallback

locks:
  stale_after_sec: 120           # a lock older than this whose owner pid is gone may be recovered

# Official TWSE market holidays (休市日期) that fall in or just before the competition period. FILL FROM THE
# OFFICIAL TWSE SCHEDULE ONLY (not guessed). Past closures are inferred from the stored price history; an
# unlisted future holiday makes T-1 prices look STALE -> BLOCK (safe side; see EMERGENCY_RUNBOOK §A).
market_holidays:              # 2026 TWSE official (config/trading_calendar_2026.yaml, retrieved 2026-10-05)
  - '2026-01-01'
  - '2026-02-12'
  - '2026-02-13'
  - '2026-02-16'
  - '2026-02-17'
  - '2026-02-18'
  - '2026-02-19'
  - '2026-02-20'
  - '2026-02-27'
  - '2026-04-03'
  - '2026-04-06'
  - '2026-05-01'
  - '2026-06-19'
  - '2026-09-25'
  - '2026-09-28'
  - '2026-10-09'
  - '2026-10-23'              # typhoon closure (Owner decision 2026-10-25, Issue #11; TWSE FMTQIK Oct lists no 10/23)
  - '2026-10-26'
  - '2026-12-25'

# Scheduler run mode (agent/ops/scheduled_run.py). PRECOMPETITION: paper ledger, DataPack NOT_REQUIRED, labelled
# PRECOMPETITION_PAPER_RUN. COMPETITION: official DataPack REQUIRED (no fallback). Switch only by explicit decision.
run_mode: PRECOMPETITION

# Runtime Team ID (P-1, approved 2026-10-16): OPERATIONS config, decoupled from the frozen strategy file
# (config/strategy_quant_v1.yaml team_id is no longer read at runtime; its sha256 stays pinned). agent/ops/team.py.
#   competition_team_id     the OFFICIAL Team ID from the organiser. null = TEAM_ID_NOT_CONFIGURED: every COMPETITION
#                           entry point BLOCKS. Fill ONLY from the organiser's official notice; never guess.
#   precompetition_team_id  label for PRECOMPETITION paper runs only (placeholders allowed there).
team:
  competition_team_id: TEAM_11442     # official Team ID (Owner-confirmed 2026-10-22, Issue #4)
  precompetition_team_id: TEAM_TEST

# Market-data coverage gate (P-2): a date is usable only when every market of the universe is present with at least
# this share of its universe tickers priced, and every holding (and ordered ticker) has a valid price.
market_coverage:
  min_market_share: 0.95

# Submission portal (manual upload only). portal_url: set ONLY by the operator to the official back-office page
# (never guessed). ui_status: NOT_YET_VERIFIED | AVAILABLE | UNAVAILABLE | LOGIN_REQUIRED. agent/submission/portal.py
# can open the page in a browser; it never logs in, selects files, uploads or submits.
submission:
  portal_url: "https://fundaiagent.esun-ai-challenge.tw/docs"   # 文件繳交 page (Owner-confirmed, Issue #4)
  ui_status: AVAILABLE           # Owner observed: upload -> 檢核結果 -> 送出繳交 -> 歷史繳交紀錄 (login required)
  official_portal_provider: DISABLED_PENDING_OFFICIAL_PORTAL_VALIDATION
  receipt_format: PENDING_PORTAL_VALIDATION   # exact receipt / history wording confirmed only after the manual E2E
  max_upload_bytes: 2097152       # D-Plan JSON <= 2 MB (portal)
  official_daily_limit: 25        # portal: 25 attempts per trading day; the accepted version is not affected
  # observed on the logged-in portal 2026-10-23 (read-only): rehearsal = validation only, nothing collected / counted
  rehearsal_window: {opens: '2026-10-23T20:30:00+08:00', closes: '2026-10-26T00:00:00+08:00', trade_date: '2026-10-27'}
  strategy_document_deadline: '2026-10-26T23:59:00+08:00'   # ETF 投資策略說明文件 (PDF <= 5 MB)
  strategy_document_status: SUBMITTED                         # portal 已繳交 2026-10-24 13:18 (Issue #12 / PR #13)
  strategy_document_submitted_at: '2026-10-24T13:18:00+08:00'
  # official TEST period (封測; organiser clears test data before the competition) — kept apart from competition
  # artefacts (never data/official_datapack/ or submissions/<T>/receipts.jsonl): agent/submission/official_test.py
  official_test_reports_dir: reports/official_test
  official_test_receipts_dir: data/official_test_receipts
  official_test_datapack_dir: data/official_test_datapack

# Guarded automated upload (Issue #4). NO documented participant API exists (portal uses SSO session + CSRF on a
# private /api) -> only normal browser automation of the human UI may ever be used, after a successful manual E2E.
# Disabled until the Owner enables it after a sealed-test automatic run reaches an official accepted state.
auto_upload:
  enabled: false
  method: none                    # none | browser   (official API: not available)
  max_automated_attempts: 3       # internal cap per trade date (official limit 25 is never exhausted)
  browser_profile_dir: data/browser_profiles/fundaiagent   # gitignored; the Owner logs in interactively once
  selectors: {}                   # filled ONLY from the observed UI after the manual E2E; empty -> fail closed
  accepted_markers: []            # verbatim official history wording meaning accepted (e.g. from the E2E); empty -> never ACCEPTED
