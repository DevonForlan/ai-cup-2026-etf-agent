# FULL REGRESSION (manual / nightly). Hosted runners have no market data: the W5 NAV and 24 decision hashes are
# verified LOCALLY with scripts/ci/local_freeze_regression.py (evidence pasted into PRs / release notes).
name: full-regression

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"   # 02:00 Asia/Taipei

permissions:
  contents: read

jobs:
  full:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-lock.txt -r requirements-llm-sdk.txt
      - run: python scripts/ci/secret_scan.py
      - run: python scripts/ci/quant_freeze_check.py
      - run: python scripts/ci/validate_configs.py
      - name: Full pytest
        run: python -m pytest -p no:cacheprovider -o addopts="" -q
      - name: Reminder
        shell: bash
        run: echo "W5 NAV / 24 decision hashes -> run scripts/ci/local_freeze_regression.py on the local machine (data/history)."
